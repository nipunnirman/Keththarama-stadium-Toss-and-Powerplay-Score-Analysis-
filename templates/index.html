<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerplay Predictor AI</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --card-glass: rgba(30, 41, 59, 0.7);
            --text-light: #f8fafc;
            --input-bg: rgba(15, 23, 42, 0.8);
            --border: rgba(99, 102, 241, 0.3);
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Ambient glowing circles */
        .ambient-glow {
            position: fixed;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            top: -10vw;
            left: -10vw;
            z-index: 0;
            pointer-events: none;
            filter: blur(40px);
        }
        .ambient-glow-2 {
            position: fixed;
            width: 30vw;
            height: 30vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, transparent 70%);
            bottom: -5vw;
            right: -10vw;
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
        }

        #root {
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: floatIn 0.8s ease-out;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin: 0 0 10px 0;
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #fbcfe8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
            outline: none;
        }

        select option {
            background: #1e293b;
            color: white;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn-submit {
            margin-top: 10px;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.4);
        }
        
        .btn-submit:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Result Animation */
        .result-container {
            margin-top: 25px;
            padding: 20px;
            border-radius: 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            text-align: center;
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .result-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: #34d399;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(52, 211, 153, 0.4);
        }
        
        .error-text {
            color: #f87171;
            font-weight: 600;
        }
        
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>
    <div id="root"></div>

    <script type="text/babel">
{% raw %}
        const { useState } = React;

        function App() {
            const [formData, setFormData] = useState({
                team: 'SL',
                opponent: 'IND',
                innings: 1,
                toss_won: 1,
                toss_decision: 'Bat'
            });
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData({
                    ...formData,
                    [name]: value
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setResult(null);
                setError(null);
                
                try {
                    const response = await fetch('/predict', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        setResult(data.predicted_pp_score);
                    } else {
                        setError(data.error || 'Failed to predict.');
                    }
                } catch (err) {
                    setError('Connection error. Is the server running?');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="glass-card">
                    <h1>Powerplay Predictor</h1>
                    <p className="subtitle">Keththarama Stadium AI Analysis</p>
                    
                    <form onSubmit={handleSubmit}>
                        <div style={{ display: 'flex', gap: '15px' }}>
                            <div className="form-group" style={{ flex: 1 }}>
                                <label>Your Team</label>
                                <input 
                                    type="text" 
                                    name="team" 
                                    value={formData.team} 
                                    onChange={handleChange} 
                                    placeholder="e.g. SL"
                                    required 
                                />
                            </div>
                            
                            <div className="form-group" style={{ flex: 1 }}>
                                <label>Opponent</label>
                                <input 
                                    type="text" 
                                    name="opponent" 
                                    value={formData.opponent} 
                                    onChange={handleChange} 
                                    placeholder="e.g. IND"
                                    required 
                                />
                            </div>
                        </div>

                        <div className="form-group">
                            <label>Innings</label>
                            <select name="innings" value={formData.innings} onChange={handleChange}>
                                <option value={1}>First Innings</option>
                                <option value={2}>Second Innings</option>
                            </select>
                        </div>

                        <div style={{ display: 'flex', gap: '15px' }}>
                            <div className="form-group" style={{ flex: 1 }}>
                                <label>Toss Won?</label>
                                <select name="toss_won" value={formData.toss_won} onChange={handleChange}>
                                    <option value={1}>Yes (Won)</option>
                                    <option value={0}>No (Lost)</option>
                                </select>
                            </div>
                            
                            <div className="form-group" style={{ flex: 1 }}>
                                <label>Toss Decision</label>
                                <select name="toss_decision" value={formData.toss_decision} onChange={handleChange}>
                                    <option value="Bat">Bat First</option>
                                    <option value="Bowl">Bowl First</option>
                                </select>
                            </div>
                        </div>

                        <button 
                            type="submit" 
                            className="btn-submit" 
                            disabled={loading}
                        >
                            {loading ? <span className="loader"></span> : 'Predict Powerplay Score ⚡'}
                        </button>
                    </form>

                    {result !== null && (
                        <div className="result-container">
                            <div style={{fontSize: '0.9rem', color: '#cbd5e1', letterSpacing: '2px', textTransform: 'uppercase'}}>Projected Score</div>
                            <div className="score-display">{result}</div>
                            <div style={{fontSize: '0.85rem', color: '#94a3b8'}}>runs</div>
                        </div>
                    )}
                    
                    {error && (
                        <div className="result-container result-error">
                            <div className="error-text">⚠️ {error}</div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
{% endraw %}
    </script>
</body>
</html>
